<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>НАНОБОТЫ — переход на сайт</title>
  <link rel="canonical" href="https://nanoboti.ru/">
  <script>
    const target = new URL("https://nanoboti.ru/");
    target.pathname = window.location.pathname;
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
  <meta http-equiv="refresh" content="0; url=https://nanoboti.ru/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef8ff; color: #12345b; font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
    a { color: #145fbb; }
  </style>
</head>
<body>
  <main>
    <h1>НАНОБОТЫ</h1>
    <p>Переходим на сайт…</p>
    <p>Если переход не произошёл, <a href="https://nanoboti.ru/">откройте nanoboti.ru</a>.</p>
  </main>
</body>
</html>
